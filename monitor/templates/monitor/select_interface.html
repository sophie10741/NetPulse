{% extends "monitor/base.html" %}

{% block title %}Выбор интерфейса{% endblock %}

{% block content %}
<div class="np-page np-page--narrow">
    <h2>Выбор интерфейса: {{ device.name }}</h2>
    <p class="np-muted">Действие: {{ action }}</p>

    <section class="np-card">
        <form method="post">
            {% csrf_token %}
            <label for="interface">Интерфейс</label>
            <select name="interface" id="interface">
                {% for interface in interfaces %}
                <option value="{{ interface.id }}">{{ interface.interface_name }} ({{ interface.ip_address|default_if_none:"без IP" }})</option>
                {% empty %}
                <option disabled>Интерфейсы не найдены</option>
                {% endfor %}
            </select>
            <div class="np-actions">
                <button type="submit">Продолжить</button>
                <a class="np-btn np-btn-secondary" href="{% url 'home' %}">К устройствам</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
